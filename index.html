<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Visualizer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="title-row">
            <h1 id="puzzle-title">Rubik's Cube</h1>
        </div>
        <div class="canvases">
            <div class="panel">
                <canvas id="trefoil" width="800" height="800"></canvas>
            </div>
            <div class="panel">
                <canvas id="cube" width="800" height="800"></canvas>
            </div>
        </div>
        <div class="controls" id="puzzle-controls">
            <!-- Dynamically populated by InputManager from puzzle.baseMoves -->
        </div>
        <div class="controls speed-control">
            <div id="puzzle-config">
                <!-- Dynamically populated by InputManager from puzzle.configParams -->
            </div>
            <span id="layer-display">Layer: 1</span>
            <span>Slow</span>
            <input id="speed" type="range" min="50" max="1000" step="50" value="750">
            <span>Fast</span>
        </div>
        <div class="solver-panel">
            <div class="solver-controls">
                <button id="step-prev" type="button" hidden>◀ Back</button>
                <button id="step-next" type="button" hidden>Next ▶</button>
                <button id="step-all" type="button" hidden>Play all ⏩</button>
                <span id="solver-status"></span>
            </div>
            <div id="solver-moves"></div>
        </div>
        <div class="patterns-panel">
            <label for="pattern-select">Pattern:</label>
            <select id="pattern-select">
                <option value="">— pick —</option>
            </select>
            <button id="paint-toggle" type="button">Paint</button>
            <button id="pattern-go" type="button">Go ▶</button>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
