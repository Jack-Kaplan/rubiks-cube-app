<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Visualizer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="title-row">
            <h1 id="puzzle-title">Rubik's Cube</h1>
            <button id="toggle-2d" type="button">Show 2D ▾</button>
        </div>
        <div class="canvases">
            <div class="panel" id="trefoil-panel">
                <canvas id="trefoil" width="800" height="800"></canvas>
            </div>
            <div class="panel">
                <canvas id="cube" width="800" height="800"></canvas>
            </div>
        </div>
        <div class="controls speed-control">
            <div id="puzzle-config">
                <!-- Dynamically populated by InputManager from puzzle.configParams -->
            </div>
            <span>Slow</span>
            <input id="speed" type="range" min="50" max="1000" step="50" value="750">
            <span>Fast</span>
        </div>
        <div class="solver-panel">
            <div class="solver-controls">
                <div class="ctrl-group">
                    <button id="scramble-btn" type="button">Scramble</button>
                    <button id="reset-btn"    type="button">Reset</button>
                </div>
                <div class="ctrl-group">
                    <button id="solve-btn"    type="button">Solve →</button>
                    <button id="goto-btn"     type="button">↩ Path here</button>
                </div>
                <div class="ctrl-group" id="playback-group" hidden>
                    <button id="step-skip-back" type="button">⏮ Skip back</button>
                    <button id="step-rev-all"   type="button">⏪ Reverse all</button>
                    <button id="step-prev"      type="button">◀ Back</button>
                    <button id="step-next"      type="button">Next ▶</button>
                    <button id="step-all"       type="button">Play all ⏩</button>
                    <button id="step-skip"      type="button">Skip ⏭</button>
                </div>
            </div>
            <div id="solver-status"></div>
            <div class="tape-viewport">
                <div id="solver-moves"></div>
            </div>
        </div>
        <div class="patterns-panel">
            <label for="pattern-select">Pattern:</label>
            <select id="pattern-select">
                <option value="">— pick —</option>
            </select>
            <button id="paint-toggle" type="button">Paint</button>
            <button id="pattern-go" type="button">Go ▶</button>
        </div>
        <div id="paint-palette" class="paint-palette" hidden>
            <span class="paint-label">Color:</span>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
